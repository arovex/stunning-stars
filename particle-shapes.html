<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Particle Shapes</title>
<style>
  html, body { margin: 0; height: 100%; background: #03050d; overflow: hidden; }
  body { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------ setup
  const COUNT      = 10000;           // particles per shape
  const HOLD_MS    = 4000;            // time a shape stays still
  const MORPH_MS   = 2400;            // time to fly to the next shape
  const FOV        = 45 * Math.PI / 180;
  const FIT_RADIUS = 2.65;            // largest shape radius to keep on screen

  const canvas = document.getElementById('scene');
  const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, preserveDrawingBuffer: true });
  if (!gl) return;

  const rand = Math.random;
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const mix = (a, b, t) => [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];

  function sphereDir() {
    const y = rand() * 2 - 1;
    const a = rand() * TAU;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    return [Math.cos(a) * r, y, Math.sin(a) * r];
  }

  // ------------------------------------------------------------- shape data
  function newShape() {
    return {
      pos: new Float32Array(COUNT * 3),
      col: new Float32Array(COUNT * 3),
      size: new Float32Array(COUNT)
    };
  }

  function put(s, i, x, y, z, c, size) {
    const j = i * 3;
    s.pos[j] = x; s.pos[j + 1] = y; s.pos[j + 2] = z;
    s.col[j] = c[0]; s.col[j + 1] = c[1]; s.col[j + 2] = c[2];
    s.size[i] = size;
  }

  // Sun: yellow / amber glow
  function buildSun() {
    const s = newShape();
    const whiteHot = [1.00, 0.97, 0.80];
    const gold     = [1.00, 0.81, 0.22];
    const amber    = [1.00, 0.56, 0.11];
    const ember    = [1.00, 0.31, 0.05];

    for (let i = 0; i < COUNT; i++) {
      const d = sphereDir();
      const kind = rand();
      let r, c, size;

      if (kind < 0.56) {
        // bright surface shell
        r = 1.14 + rand() * 0.16;
        c = mix(gold, whiteHot, Math.pow(rand(), 2));
        size = 1.5 + rand() * 1.4;
      } else if (kind < 0.84) {
        // inner glowing volume
        r = 0.35 + Math.pow(rand(), 0.65) * 0.78;
        c = mix(amber, whiteHot, rand() * 0.9);
        size = 1.2 + rand() * 1.2;
      } else {
        // corona
        r = 1.30 + Math.pow(rand(), 1.7) * 0.85;
        c = mix(amber, ember, rand());
        size = 1.0 + rand() * 1.2;
      }
      put(s, i, d[0] * r, d[1] * r, d[2] * r, c, size);
    }
    return s;
  }

  // Earth: blue oceans, green land, white poles and clouds
  function buildEarth() {
    const s = newShape();
    const deep    = [0.05, 0.16, 0.62];
    const ocean   = [0.10, 0.40, 0.95];
    const shallow = [0.28, 0.72, 1.00];
    const grass   = [0.08, 0.55, 0.30];
    const leaf    = [0.36, 0.86, 0.42];
    const sand    = [0.85, 0.78, 0.42];
    const ice     = [0.82, 0.94, 1.00];
    const cloud   = [0.85, 0.93, 1.00];

    // random continent caps, warped a little so the coastlines look organic
    const caps = [];
    for (let k = 0; k < 6; k++) caps.push({ d: sphereDir(), r: 0.34 + rand() * 0.50 });

    function isLand(x, y, z) {
      const warp = 0.10 * Math.sin(4.1 * x + 1.7) * Math.sin(4.3 * y + 0.4) * Math.sin(4.7 * z + 2.2)
                 + 0.06 * Math.sin(8.8 * x + 0.3) * Math.sin(9.1 * y + 2.6) * Math.sin(8.6 * z + 1.1);
      for (let k = 0; k < caps.length; k++) {
        const c = caps[k];
        const dot = x * c.d[0] + y * c.d[1] + z * c.d[2];
        if (dot > Math.cos(c.r) + warp) return true;
      }
      return false;
    }

    const R = 1.28;
    for (let i = 0; i < COUNT; i++) {
      const d = sphereDir();
      const x = d[0], y = d[1], z = d[2];
      const isCloud = rand() < 0.045;
      let r = R * (0.985 + rand() * 0.03);
      let c, size = 1.35 + rand() * 1.25;

      if (isCloud) {
        r = R * (1.02 + rand() * 0.09);
        c = mix(cloud, ice, rand());
        size = 1.0 + rand() * 1.0;
      } else if (Math.abs(y) > 0.90) {
        c = mix(ice, cloud, rand() * 0.5);
      } else if (isLand(x, y, z)) {
        c = mix(grass, leaf, rand());
        if (rand() < 0.05) c = sand;
      } else {
        c = mix(deep, ocean, rand());
        if (rand() < 0.10) c = mix(ocean, shallow, rand());
      }
      put(s, i, x * r, y * r, z * r, c, size);
    }
    return s;
  }

  // Moon: white and black with craters
  function buildMoon() {
    const s = newShape();
    const white = [0.98, 0.98, 0.99];
    const light = [0.82, 0.83, 0.87];
    const grey  = [0.55, 0.56, 0.61];
    const dark  = [0.24, 0.25, 0.30];
    const black = [0.04, 0.04, 0.06];

    const craters = [];
    for (let k = 0; k < 22; k++) craters.push({ d: sphereDir(), r: 0.10 + Math.pow(rand(), 1.8) * 0.34 });

    const R = 1.15;
    for (let i = 0; i < COUNT; i++) {
      const d = sphereDir();
      const x = d[0], y = d[1], z = d[2];
      let shade = 0.55 + rand() * 0.45;

      for (let k = 0; k < craters.length; k++) {
        const cr = craters[k];
        const dot = clamp(x * cr.d[0] + y * cr.d[1] + z * cr.d[2], -1, 1);
        const ang = Math.acos(dot);
        if (ang < cr.r) {
          const t = ang / cr.r;              // 0 centre, 1 rim
          shade *= 0.30 + 0.70 * t * t;      // dark bowl
        } else if (ang < cr.r * 1.15) {
          const t = (ang - cr.r) / (cr.r * 0.15);
          shade = Math.min(1, shade + 0.28 * (1 - t)); // bright rim
        }
      }

      // large dark "seas"
      const maria = 0.5 + 0.5 * Math.sin(2.3 * x + 1.1) * Math.sin(2.1 * y + 2.0) * Math.sin(2.6 * z + 0.4);
      shade = clamp(shade * (0.70 + 0.36 * maria), 0, 1);

      let c;
      if (shade < 0.22)      c = mix(black, dark, shade / 0.22);
      else if (shade < 0.55) c = mix(dark, grey, (shade - 0.22) / 0.33);
      else if (shade < 0.82) c = mix(grey, light, (shade - 0.55) / 0.27);
      else                   c = mix(light, white, (shade - 0.82) / 0.18);

      const r = R * (0.985 + rand() * 0.03);
      put(s, i, x * r, y * r, z * r, c, 1.25 + rand() * 1.35);
    }
    return s;
  }

  // Saturn: gold planet + tilted ring
  function buildSaturn() {
    const s = newShape();
    const cream = [0.98, 0.90, 0.72];
    const gold  = [0.93, 0.78, 0.50];
    const tan   = [0.78, 0.60, 0.34];
    const rust  = [0.62, 0.44, 0.22];

    // ring bands (a = inner radius, b = outer radius, w = relative density)
    const bands = [
      { a: 1.32, b: 1.64, w: 3.0 },
      { a: 1.70, b: 1.86, w: 1.1 },
      { a: 1.92, b: 2.26, w: 2.4 },
      { a: 2.31, b: 2.48, w: 0.8 }
    ];
    let totalW = 0;
    for (let k = 0; k < bands.length; k++) totalW += bands[k].w;

    const tiltX = 0.46, tiltZ = -0.20;
    const cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
    const cosZ = Math.cos(tiltZ), sinZ = Math.sin(tiltZ);

    function tilted(i, x, y, z, c, size) {
      const y1 = y * cosX - z * sinX;
      const z1 = y * sinX + z * cosX;
      const x1 = x * cosZ - y1 * sinZ;
      const y2 = x * sinZ + y1 * cosZ;
      put(s, i, x1, y2, z1, c, size);
    }

    for (let i = 0; i < COUNT; i++) {
      if (rand() < 0.62) {
        // ring
        let pick = rand() * totalW;
        let band = bands[0];
        for (let k = 0; k < bands.length; k++) {
          if (pick <= bands[k].w) { band = bands[k]; break; }
          pick -= bands[k].w;
        }
        const r = band.a + rand() * (band.b - band.a);
        const ang = rand() * TAU;
        const x = Math.cos(ang) * r;
        const z = Math.sin(ang) * r;
        const y = (rand() - 0.5) * 0.035;

        let c = mix(cream, gold, rand());
        if (rand() < 0.10) c = mix(gold, tan, rand());
        if (rand() < 0.05) c = [1.00, 0.97, 0.88];
        tilted(i, x, y, z, c, 1.0 + rand() * 1.1);
      } else {
        // planet body, slightly squashed
        const d = sphereDir();
        const r = 0.98;
        const x = d[0] * r;
        const y = d[1] * r * 0.90;
        const z = d[2] * r;

        const t = 0.5 + 0.5 * Math.sin(y * 17.0 + 0.6);
        let c = mix(gold, cream, t);
        if (rand() < 0.18) c = mix(tan, rust, rand());
        tilted(i, x, y, z, c, 1.3 + rand() * 1.3);
      }
    }
    return s;
  }

  // order: Saturn -> Earth -> Moon -> Sun
  const shapes = [buildSaturn(), buildEarth(), buildMoon(), buildSun()];

  // static per-particle seed used for the swirl while morphing
  const swirl = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT * 3; i++) swirl[i] = rand() * 2 - 1;

  // --------------------------------------------------------------- shaders
  const VERT = [
    'attribute vec3 aPos;',
    'attribute vec3 aColor;',
    'attribute float aSize;',
    'attribute float aPhase;',
    'uniform mat4 uProj;',
    'uniform float uTime;',
    'uniform float uDpr;',
    'uniform float uCamZ;',
    'uniform float uSpin;',
    'varying vec3 vColor;',
    'varying float vTwinkle;',
    'void main() {',
    '  float ph = aPhase * 6.28318530718;',
    '  vec3 p = aPos;',
    '  p += vec3(',
    '    sin(uTime * 1.7 + ph),',
    '    cos(uTime * 1.3 + ph * 1.7),',
    '    sin(uTime * 1.1 + ph * 0.7)',
    '  ) * 0.010;',
    '  float cs = cos(uSpin), sn = sin(uSpin);',
    '  p = vec3(cs * p.x - sn * p.z, p.y, sn * p.x + cs * p.z);',
    '  float ct = 0.96106, st = 0.27636;', // slight tilt around X
    '  p = vec3(p.x, ct * p.y - st * p.z, st * p.y + ct * p.z);',
    '  vec4 mv = vec4(p.x, p.y, p.z - uCamZ, 1.0);',
    '  gl_Position = uProj * mv;',
    '  float tw = 0.68 + 0.32 * sin(uTime * 2.3 + ph * 3.0);',
    '  vTwinkle = tw;',
    '  vColor = aColor;',
    '  gl_PointSize = min(aSize * uDpr * (10.0 / -mv.z) * (0.72 + 0.5 * tw), 40.0);',
    '}'
  ].join('\n');

  const FRAG = [
    'precision mediump float;',
    'varying vec3 vColor;',
    'varying float vTwinkle;',
    'void main() {',
    '  vec2 d = gl_PointCoord - vec2(0.5);',
    '  float r = length(d);',
    '  if (r > 0.5) discard;',
    '  float core = 1.0 - smoothstep(0.0, 0.34, r);',
    '  float halo = 1.0 - smoothstep(0.0, 0.5, r);',
    '  halo *= halo;',
    '  float sparkle = pow(core, 5.0);',
    '  float a = (core * 0.75 + halo * 0.5) * vTwinkle;',
    '  vec3 col = vColor * (0.50 + 1.60 * halo) + vec3(1.0) * sparkle * 0.60;',
    '  gl_FragColor = vec4(col * a, a);',
    '}'
  ].join('\n');

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    return sh;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  gl.useProgram(program);

  const aPos   = gl.getAttribLocation(program, 'aPos');
  const aColor = gl.getAttribLocation(program, 'aColor');
  const aSize  = gl.getAttribLocation(program, 'aSize');
  const aPhase = gl.getAttribLocation(program, 'aPhase');

  const uProj = gl.getUniformLocation(program, 'uProj');
  const uTime = gl.getUniformLocation(program, 'uTime');
  const uDpr  = gl.getUniformLocation(program, 'uDpr');
  const uCamZ = gl.getUniformLocation(program, 'uCamZ');
  const uSpin = gl.getUniformLocation(program, 'uSpin');

  // --------------------------------------------------------------- buffers
  function makeBuffer(data, usage) {
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, usage);
    return b;
  }

  const posBuf   = makeBuffer(new Float32Array(COUNT * 3), gl.DYNAMIC_DRAW);
  const colBuf   = makeBuffer(new Float32Array(COUNT * 3), gl.DYNAMIC_DRAW);
  const sizeBuf  = makeBuffer(new Float32Array(COUNT), gl.DYNAMIC_DRAW);
  const phaseArr = new Float32Array(COUNT);
  for (let i = 0; i < COUNT; i++) phaseArr[i] = rand();
  const phaseBuf = makeBuffer(phaseArr, gl.STATIC_DRAW);

  function bindAttrib(loc, buf, size) {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  }
  bindAttrib(aPos, posBuf, 3);
  bindAttrib(aColor, colBuf, 3);
  bindAttrib(aSize, sizeBuf, 1);
  bindAttrib(aPhase, phaseBuf, 1);

  // ----------------------------------------------------------------- state
  const curPos  = new Float32Array(COUNT * 3);
  const curCol  = new Float32Array(COUNT * 3);
  const curSize = new Float32Array(COUNT);

  let shapeIndex = 0;
  let from = shapes[0];
  let to   = shapes[0];
  let morph = 1;
  let morphStart = 0;
  let holdUntil = performance.now() + 2600;

  function easeInOut(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // ---------------------------------------------------------------- resize
  let camZ = 7.0;
  let dpr = 1;

  function perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(w * dpr));
    canvas.height = Math.max(1, Math.floor(h * dpr));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);

    const aspect = w / h;
    camZ = (FIT_RADIUS / (Math.tan(FOV / 2) * Math.min(1, aspect))) * 1.16;

    gl.useProgram(program);
    gl.uniformMatrix4fv(uProj, false, perspective(FOV, aspect, 0.1, 100));
    gl.uniform1f(uCamZ, camZ);
    gl.uniform1f(uDpr, dpr);
  }

  window.addEventListener('resize', resize);

  // ----------------------------------------------------------------- setup
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.clearColor(0.012, 0.020, 0.050, 1);

  resize();

  // ------------------------------------------------------------------ loop
  function frame(now) {
    const time = now * 0.001;

    // switch to the next shape when the current hold is over
    if (morph >= 1 && now >= holdUntil) {
      from = to;
      shapeIndex = (shapeIndex + 1) % shapes.length;
      to = shapes[shapeIndex];
      morphStart = now;
      morph = 0;
    }
    if (morph < 1) {
      morph = Math.min(1, (now - morphStart) / MORPH_MS);
      if (morph >= 1) holdUntil = now + HOLD_MS;
    }

    const k = easeInOut(morph);
    const burst = Math.sin(Math.PI * morph); // 0 -> 1 -> 0 while morphing

    const fp = from.pos, tp = to.pos;
    const fc = from.col, tc = to.col;
    const fs = from.size, ts = to.size;
    const arm = burst * 0.55;
    const grow = 1 + 0.25 * burst;

    for (let i = 0; i < COUNT; i++) {
      const j = i * 3;
      const ax = fp[j], ay = fp[j + 1], az = fp[j + 2];
      const bx = tp[j], by = tp[j + 1], bz = tp[j + 2];

      curPos[j]     = ax + (bx - ax) * k + swirl[j]     * arm;
      curPos[j + 1] = ay + (by - ay) * k + swirl[j + 1] * arm;
      curPos[j + 2] = az + (bz - az) * k + swirl[j + 2] * arm;

      curCol[j]     = fc[j]     + (tc[j]     - fc[j])     * k;
      curCol[j + 1] = fc[j + 1] + (tc[j + 1] - fc[j + 1]) * k;
      curCol[j + 2] = fc[j + 2] + (tc[j + 2] - fc[j + 2]) * k;

      curSize[i] = (fs[i] + (ts[i] - fs[i]) * k) * grow;
    }

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(program);

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, curPos);
    gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, curCol);
    gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, curSize);

    gl.uniform1f(uTime, time);
    gl.uniform1f(uSpin, time * 0.20);
    gl.drawArrays(gl.POINTS, 0, COUNT);

    requestAnimationFrame(frame);
  }

  window.__showShape = function (idx) {
    from = to = shapes[idx];
    morph = 1;
    holdUntil = performance.now() + 1e9;
    frame(performance.now());
  };
  window.__showShape(0);
})();
</script>
</body>
</html>
